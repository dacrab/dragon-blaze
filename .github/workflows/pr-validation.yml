name: PR Validation

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Check for merge conflicts
        run: |
          if git grep -l "<<<<<<< HEAD" -- '*.cs' '*.unity' '*.prefab' '*.asset'; then
            echo "Merge conflict markers found"
            exit 1
          fi

      - name: Check file naming
        run: |
          # Check for spaces in filenames (Unity best practice)
          if find Assets -name "* *" -type f | grep -v ".meta$"; then
            echo "Files with spaces found in Assets/"
            exit 1
          fi

      - name: Validate meta files
        run: |
          # Check that all assets have .meta files
          for file in $(find Assets -type f ! -name "*.meta"); do
            if [ ! -f "$file.meta" ]; then
              echo "Missing .meta file for: $file"
              exit 1
            fi
          done
